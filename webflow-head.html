<!-- Mega motion: head code (Site settings > Custom code > Head code) -->
<script>
  // Mark motion as on before first paint, unless the visitor prefers reduced motion.
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.documentElement.classList.add("mega-motion");
  }
</script>
<style>
  /* Lenis recommended CSS (check it against the pinned Lenis version) */
  html.lenis, html.lenis body { height: auto; }

  .lenis [data-lenis-prevent-vertical], .lenis [data-lenis-prevent-horizontal] { overscroll-behavior: contain; }

  /* Background videos: hidden until they actually play (mega-motion.js sets data-playing), so the poster image
