<!-- Mega motion: head code (Site settings > Custom code > Head code) -->
<script>
  // Mark motion as on before first paint, unless the visitor prefers reduced motion.
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.documentElement.classList.add("mega-motion");
  }
</script>
<style>
  /* Lenis recommended CSS (check it against the pinned Lenis version) */
  html.lenis, html.lenis body { height: auto; }
  .lenis:not(.lenis-autoToggle).lenis-stopped { overflow: clip; }
  .lenis [data-lenis-prevent], .lenis [data-lenis-prevent-wheel], .lenis [data-lenis-prevent-touch],
  .lenis [data-lenis-prevent-vertical], .lenis [data-lenis-prevent-horizontal] { overscroll-behavior: contain; }
  .lenis.lenis-smooth iframe { pointer-events: none; }
  .lenis.lenis-autoToggle { transition-property: overflow; transition-duration: 1ms; transition-behavior: allow-discrete; }

  /* Reveal guard: what animates in is hidden until the script is ready.
     If the script hasn't run within 3s, everything shows anyway.
     Keep these selectors in step with the script (SECTIONS, CARDS); add project ones pass by pass. */
  @keyframes mega-motion-fallback { to { visibility: visible; } }
  html.mega-motion:not(.mega-motion-ready) .nav_component,
  html.mega-motion:not(.mega-motion-ready) main > section:first-child :is(.hero_art_img, .u-icon, .u-text, .u-button-wrapper),
  html.mega-motion:not(.mega-motion-ready) .card_company_wrap,
  html.mega-motion:not(.mega-motion-ready) .card_team_wrap :is(.card_team_visual, .card_team_name, .card_team_role, .card_team_bio) {
    visibility: hidden;
    animation: mega-motion-fallback 0s 3s forwards;
  }
</style>
